<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Happy Bridge Verify Page</title></head>
<body>

  <input id="result" aria-label="Result" readonly>
  <div contenteditable="true" id="editable-area">edit me</div>

    })
  </script>
</body>
</html>
