<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Happy Bridge Verify Page</title>
  <style>html { scroll-behavior: smooth; }</style>
</head>
<body>
  <h1>Happy Bridge Verify Page</h1>
  <input id="name-input" placeholder="Your name">
  <button id="submit-btn">Submit</button>
  <input id="result" aria-label="Result" readonly>
  <div contenteditable="true" id="editable-area">edit me</div>
  <div hidden><button>Hidden attribute fixture action</button></div>
  <div aria-hidden="true"><button>Aria hidden fixture action</button></div>
  <div inert><button>Inert fixture action</button></div>
  <div style="display:none"><button>Display none fixture action</button></div>
  <div style="content-visibility:hidden"><button>Content visibility fixture action</button></div>
  <button style="content-visibility:hidden" aria-label="Visible content-hidden shell">
    <span role="button">Content-hidden nested action</span>
  </button>
  <details>
    <summary>Collapsed details summary</summary>
    <button>Collapsed details action</button>
  </details>
  <section>
    <h2>Nested lazy results</h2>
    <div id="nested-results" aria-label="Nested lazy results" style="height:180px; overflow-y:auto; scroll-behavior:smooth; border:1px solid #999">
      <button>Nested first item</button>
      <div style="height:700px"></div>
      <div id="nested-sentinel">Nested loading sentinel</div>
    </div>
  </section>
  <section>
    <h2>Script-scrollable hidden overflow</h2>
    <div id="hidden-overflow-results" aria-label="Hidden overflow results" style="position:fixed; top:430px; right:10px; width:300px; height:100px; overflow-y:hidden; scroll-behavior:smooth; border:1px solid #999">
      <button>Hidden overflow first item</button>
      <div style="height:500px"></div>
    </div>
  </section>
  <section>
    <h2>Slotted scroll results</h2>
    <div id="slotted-scroll-host">
      <button slot="items">Slotted first item</button>
    </div>
  </section>
  <div id="long-page-prefix"></div>
  <div id="clipping-fixture" style="position:fixed; top:0; left:0; width:300px; height:1px; overflow:hidden">
    <div style="position:fixed; top:360px; right:10px"><button>Fixed escape action</button></div>
  </div>
  <div style="position:fixed; top:0; left:320px; width:300px; height:1px; overflow:clip; will-change:translate">
    <button style="position:fixed; top:360px; right:10px">Contained fixed fixture action</button>
  </div>
  <div style="position:fixed; top:240px; right:10px">
    <button>Fixed non-scroller action</button>
  </div>
  <button id="visible-after-clipped" style="position:fixed; top:300px; right:10px">Visible after clipped controls</button>
  <div style="height:1400px"></div>
  <div id="document-sentinel">Document loading sentinel</div>
  <script>
    document.getElementById('submit-btn').addEventListener('click', function () {
      document.getElementById('result').value = 'Hello, ' + document.getElementById('name-input').value + '!'
    })

    const nestedResults = document.getElementById('nested-results')
    const slottedScrollHost = document.getElementById('slotted-scroll-host')
    const slottedShadow = slottedScrollHost.attachShadow({ mode: 'open' })
    slottedShadow.innerHTML = '<div aria-label="Slotted scroll results" style="height:100px;overflow-y:auto;scroll-behavior:smooth;border:1px solid #999"><slot name="items"></slot><div style="height:500px"></div></div>'
    const longPagePrefix = document.getElementById('long-page-prefix')
    for (let i = 0; i < 205; i += 1) {
      const button = document.createElement('button')
      button.textContent = 'Earlier action ' + i
      longPagePrefix.appendChild(button)
    }
    const clippingFixture = document.getElementById('clipping-fixture')
    for (let i = 0; i < 20; i += 1) {
      const button = document.createElement('button')
      button.style.position = 'absolute'
      button.style.top = '40px'
      button.textContent = 'Clipped fixture action ' + i
      clippingFixture.appendChild(button)
    }

    new IntersectionObserver(function (entries, observer) {
      if (!entries.some(function (entry) { return entry.isIntersecting })) return
      const button = document.createElement('button')
      button.textContent = 'Nested lazy item'
      nestedResults.appendChild(button)
      observer.disconnect()
    }, { root: nestedResults }).observe(document.getElementById('nested-sentinel'))

    new IntersectionObserver(function (entries, observer) {
      if (!entries.some(function (entry) { return entry.isIntersecting })) return
      const button = document.createElement('button')
      button.textContent = 'Document lazy item'
      document.body.appendChild(button)
      observer.disconnect()
    }).observe(document.getElementById('document-sentinel'))
  </script>
</body>
</html>
