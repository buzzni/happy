name: CLI Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-browser-extension/**'
      - 'packages/happy-server/**'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-browser-extension/**'
      - 'packages/happy-server/**'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    # npm 10 crashes in Arborist while installing the packed CLI + self-host
    # server together. Keep the Node 20 runtime test with the verified npm 11.
    - name: Use verified npm for Node 20
      if: matrix.node-version == 20
      run: npm install -g npm@11.19.0

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build package
      run: pnpm --filter @buzzni/happy-cli build

    - name: Verify personal Claude authentication with the real SDK
      if: matrix.node-version == 24
      timeout-minutes: 5
      env:
        HAPPY_CLAUDE_AUTH_PIN_INTEGRATION: '1'
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        # Ubuntu's AppArmor user-namespace restriction prevents unprivileged bwrap
        # before the SDK starts. Relax it only in this disposable CI runner;
        # policies remain inside the test's private mount namespace.
        if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        pnpm --filter @buzzni/happy-cli exec vitest run --project integration-claude-auth-pin

    - name: Verify browser app consent and reconnect recovery
      timeout-minutes: 10
      run: |
        pnpm --filter @buzzni/happy-cli exec vitest run --project unit \
          src/browserRuntime/localClientApps.test.ts \
          src/browserRuntime/localClientConsent.test.ts \
          src/browserRuntime/localClientSession.test.ts \
          src/browserRuntime/localClientReconnect.test.ts \
          src/browserRuntime/localClients.test.ts \
          src/commands/browserClientCommand.test.ts

    - name: Verify local browser client with Chrome and Unix broker
      if: matrix.node-version == 24
      timeout-minutes: 10
      env:
        BROWSER_CLIENT_REAL_SMOKE: '1'
      run: |
        export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
        test -n "$CHROME_PATH"
        pnpm --filter @buzzni/happy-cli exec vitest run --project browser-poc src/browserRuntime/localClients.poc.test.ts

    # `happy server` resolves the self-host runtime and bundled webapp from
    # happy-server-self-host. The server package is JS/TS and lets npm install
    # platform-specific dependencies such as Prisma and sharp normally.
    - name: Generate Prisma client + bundle happy-server-self-host webapp
      run: |
        pnpm --filter happy-server-self-host generate
        pnpm --filter happy-server-self-host run bundle:webapp

    - name: Pack packages
      run: |
        node packages/happy-cli/scripts/prepare-publish-package.cjs --out "$RUNNER_TEMP/happy-cli-publish"
        node packages/happy-cli/scripts/guard-publish-artifact.cjs "$RUNNER_TEMP/happy-cli-publish"
        npm pack "$RUNNER_TEMP/happy-cli-publish" --ignore-scripts --pack-destination packages/happy-cli
        cp .npmrc "$RUNNER_TEMP/npmrc.backup"
        trap 'cp "$RUNNER_TEMP/npmrc.backup" .npmrc' EXIT
        node -e "const fs=require('fs'); fs.writeFileSync('.npmrc', fs.readFileSync('.npmrc','utf8').replace(/^node-linker=.*/m, 'node-linker=hoisted'))"
        pnpm --filter happy-server-self-host pack --pack-destination packages/happy-server
        trap - EXIT
        cp "$RUNNER_TEMP/npmrc.backup" .npmrc

    - name: Install packed packages globally
      run: |
        HAPPY_PACKAGE_FILE=$(ls packages/happy-cli/*.tgz)
        SERVER_PACKAGE_FILE=$(ls packages/happy-server/*.tgz)
        npm install -g "./$SERVER_PACKAGE_FILE" "./$HAPPY_PACKAGE_FILE"

    - name: Test binary execution
      run: |
        # Test that the binary starts successfully
        echo "Testing happy --help..."
        timeout 30s happy --help || {
          echo "Error: happy --help failed or timed out"
          exit 1
        }

        echo "Testing happy --version..."
        timeout 10s happy --version || {
          echo "Error: happy --version failed or timed out"
          exit 1
        }

        echo "Testing happy doctor..."
        timeout 30s happy doctor || {
          echo "Error: happy doctor failed or timed out"
          exit 1
        }

        echo "Testing happy daemon status..."
        timeout 10s happy daemon status || {
          echo "Error: happy daemon status failed or timed out"
          exit 1
        }

        echo "Binary smoke test passed on Linux!"

    - name: Test packaged server (happy server)
      run: |
        export HAPPY_HOME_DIR="$(mktemp -d)"
        timeout 90s happy server --port 4505 --host 127.0.0.1 --no-persist --reset > /tmp/happy-server.log 2>&1 &
        SERVER_PID=$!
        UP=0
        for i in $(seq 1 60); do
          if curl -sf -m 2 http://127.0.0.1:4505/ -o /dev/null; then UP=1; echo "server up after ${i}s"; break; fi
          sleep 1
        done
        # Exercise the Prisma native query engine via a DB-backed read.
        PK=$(node -e "console.log(Buffer.alloc(32).toString('base64'))")
        BODY=$(curl -s -m 5 -G http://127.0.0.1:4505/v1/auth/request/status --data-urlencode "publicKey=$PK" || true)
        echo "auth/request/status -> $BODY"
        kill "$SERVER_PID" 2>/dev/null || true
        pkill -f happy-server || true
        echo "=== happy server log ==="; cat /tmp/happy-server.log || true
        if [ "$UP" != "1" ]; then echo "Error: happy server did not become healthy"; exit 1; fi
        if ! echo "$BODY" | grep -q '"status"'; then echo "Error: Prisma-backed endpoint did not respond"; exit 1; fi
        if grep -qiE 'PrismaClientInitializationError|could not locate.*Query Engine' /tmp/happy-server.log; then echo "Error: Prisma query engine failed to load"; exit 1; fi
        echo "happy server smoke test passed (booted + Prisma query engine OK)"

  smoke-test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build package
      run: pnpm --filter @buzzni/happy-cli build

    - name: Pack package
      run: |
        $publishDir = Join-Path $env:RUNNER_TEMP "happy-cli-publish"
        node packages/happy-cli/scripts/prepare-publish-package.cjs --out $publishDir
        npm pack $publishDir --ignore-scripts --pack-destination packages/happy-cli

    - name: Install packed package globally
      shell: cmd
      run: |
        for %%f in (packages\happy-cli\*.tgz) do npm install -g "%%f"

    - name: Debug npm global installation structure
      shell: cmd
      run: |
        for /f "tokens=*" %%i in ('npm config get prefix') do set NPM_PREFIX=%%i
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Listing npm prefix directory:
        dir "%NPM_PREFIX%" 2>nul || echo Failed to list NPM_PREFIX
        echo.
        echo Checking for node_modules in npm prefix:
        if exist "%NPM_PREFIX%\node_modules" (
          echo Found node_modules directory
          dir "%NPM_PREFIX%\node_modules" 2>nul
          echo.
          echo Checking for happy package:
          if exist "%NPM_PREFIX%\node_modules\happy" (
            echo Found happy package
            dir "%NPM_PREFIX%\node_modules\happy" 2>nul
            echo.
            echo Checking for dist directory:
            if exist "%NPM_PREFIX%\node_modules\happy\dist" (
              echo Found dist directory
              dir "%NPM_PREFIX%\node_modules\happy\dist" 2>nul
            ) else (
              echo No dist directory found
            )
          ) else (
            echo No happy package found
          )
        ) else (
          echo No node_modules directory found
        )

    - name: Test binary execution
      shell: cmd
      run: |
        @echo on

        rem Get npm global prefix and add to PATH
        for /f "tokens=*" %%i in ('npm config get prefix') do set NPM_PREFIX=%%i
        set PATH=%NPM_PREFIX%;%PATH%
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Current PATH: %PATH%

        rem Debug: Check if happy exists in various locations
        echo Checking for happy binary...
        where happy 2>nul && echo Found happy in PATH || echo happy not found in PATH
        if exist "%NPM_PREFIX%\happy.cmd" echo Found happy.cmd in NPM_PREFIX
        if exist "%NPM_PREFIX%\node_modules\.bin\happy.cmd" echo Found happy.cmd in .bin directory
        dir "%NPM_PREFIX%\*happy*" 2>nul || echo No happy files found in NPM_PREFIX

        rem Debug: Check the actual contents and encoding of the installed file
        if exist "%NPM_PREFIX%\happy.cmd" (
          echo File size and type:
          dir "%NPM_PREFIX%\happy.cmd"
          echo.
          echo First few lines of the file:
          type "%NPM_PREFIX%\happy.cmd" | head -5
          echo.
          echo Hex dump of first 50 bytes to check line endings:
          powershell -Command "Get-Content '%NPM_PREFIX%\happy.cmd' -Encoding Byte -TotalCount 50 | ForEach-Object { '{0:X2}' -f $_ } | Join-String -Separator ' '"
          echo.
          echo Testing with direct path...
          "%NPM_PREFIX%\happy.cmd" --help
        ) else (
          echo Testing happy --help...
          happy --help
        )
        if errorlevel 1 (
          echo Error: happy --help failed
          exit /b 1
        )

        rem Test version
        if exist "%NPM_PREFIX%\happy.cmd" (
          "%NPM_PREFIX%\happy.cmd" --version
        ) else (
          happy --version
        )
        if errorlevel 1 (
          echo Error: happy --version failed
          exit /b 1
        )

        rem Test doctor
        echo Testing happy doctor...
        if exist "%NPM_PREFIX%\happy.cmd" (
          "%NPM_PREFIX%\happy.cmd" doctor
        ) else (
          happy doctor
        )
        if errorlevel 1 (
          echo Error: happy doctor failed
          exit /b 1
        )

        rem Test daemon status
        echo Testing happy daemon status...
        if exist "%NPM_PREFIX%\happy.cmd" (
          "%NPM_PREFIX%\happy.cmd" daemon status
        ) else (
          happy daemon status
        )
        if errorlevel 1 (
          echo Error: happy daemon status failed
          exit /b 1
        )

        echo Smoke test passed on Windows!

  smoke-test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm --filter @buzzni/happy-cli build
      - name: Verify host sandbox test is eligible
        run: |
          test "$(uname -s)" = Darwin
          test -z "${CODEX_SANDBOX:-}"
      - name: Install sandbox test dependency
        run: |
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          rg --version
      - name: Install tmux spawn test dependency
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          tmux -V
      - name: Install scheduled conversation integration dependencies
        run: |
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          npm install -g codex-multi-auth@2.16.0
          npm install -g @openai/codex@0.162.1
          codex --version
      - name: Verify legacy Chat and dataKey Project scheduled conversations
        timeout-minutes: 10
        env:
          HAPPY_SCHEDULED_TOOLS_INTEGRATION: '1'
          HAPPY_SCOPE_FIXTURE_PARENT: ${{ runner.temp }}
        run: |
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          SCHEDULED_PG_DIR="$RUNNER_TEMP/scheduled-conversation-pg"
          initdb -D "$SCHEDULED_PG_DIR" -A trust -U scheduled_fixture
          pg_ctl -D "$SCHEDULED_PG_DIR" -l "$RUNNER_TEMP/scheduled-conversation-pg.log" -o "-h 127.0.0.1 -p 55432" -w start
          trap 'pg_ctl -D "$SCHEDULED_PG_DIR" -m immediate -w stop' EXIT
          createdb -h 127.0.0.1 -p 55432 -U scheduled_fixture scheduled_fixture
          export HAPPY_SCHEDULED_TOOLS_DATABASE_URL="postgresql://scheduled_fixture@127.0.0.1:55432/scheduled_fixture"
          pnpm --filter @buzzni/happy-cli exec vitest run --project integration-scheduled-tools
      - name: Run unit tests including real Git sandbox enforcement
        run: pnpm --filter @buzzni/happy-cli exec vitest run --project unit
